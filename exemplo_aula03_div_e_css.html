<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Div Com Css</title>
    <style>
        div{


            font: size 10px; ;
            text-align: center;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;

            
        }
        #principal
        {
            background-color: rgb(26, 252, 6);
            border: 5px solid rgb(36, 83, 40);
            color:  rgb(2, 2, 2);


        }
        #Secundaria{
            background-color: rgb(0, 253, 34);
            border: 5px solid rgb(36, 83, 40);
            color: rgb(7, 7, 7);
        }
        hr{
            border: rgb(255, 10, 10);
            border-top: 3px solid rgb(27, 255, 6);
            width: 120%;
        }




    </style>
</head>
<body>


    <div id="principal">
        Está é a primeira linha.
        </br>
        E essa é a segunda linha
        </br>
    
    </div>
    <hr/>
    <div id="Secundaria">
        Está é outra divisão da pagina
    </br>
        E Está começa uma nova linha.
    </br>
    </div>

</body>
</html>
